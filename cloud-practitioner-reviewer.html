<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}[hidden]{display:none!important}</style></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<title>Cloud Practitioner Reviewer</title>
<script>try{const t=localStorage.getItem("clf-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;800&family=Atkinson+Hyperlegible+Mono:wght@400;600&display=swap">
<style>
/* Layout: exam booklet plus bubble answer sheet. One reading column, sheet beside it on wide screens. */
:root{
  --bg:#F1F5FB; --surface:#FFFFFF; --ink:#15203B; --muted:#55617F; --rule:#CCD6E8;
  --pen:#1E45B4; --pen-soft:#E1E9FB; --on-pen:#FFFFFF;
  --good:#136B42; --good-soft:#DFF2E7; --bad:#A9231B; --bad-soft:#FBE4E2; --flag:#935300; --flag-soft:#FBEBD0;
  --font:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",Verdana,system-ui,sans-serif;
  --mono:"Atkinson Hyperlegible Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1525; --surface:#172139; --ink:#E7ECF8; --muted:#A0ADC9; --rule:#2F3C5C;
  --pen:#93B3FF; --pen-soft:#22315C; --on-pen:#0E1525;
  --good:#6AD39B; --good-soft:#15372A; --bad:#FF948B; --bad-soft:#442026; --flag:#F2BA55; --flag-soft:#3D2F14; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1525; --surface:#172139; --ink:#E7ECF8; --muted:#A0ADC9; --rule:#2F3C5C;
  --pen:#93B3FF; --pen-soft:#22315C; --on-pen:#0E1525;
  --good:#6AD39B; --good-soft:#15372A; --bad:#FF948B; --bad-soft:#442026; --flag:#F2BA55; --flag-soft:#3D2F14; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 1rem/1.55 var(--font)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{line-height:1.2;margin:0;text-wrap:balance}
h1{font-size:1.75rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.25rem;font-weight:800}
h3{font-size:1.05rem;font-weight:800}
p{margin:0;max-width:65ch}
.muted{color:var(--muted)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
.wrap{max-width:66rem;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--rule)}
header.top .wrap{display:flex;flex-wrap:wrap;gap:.25rem 1.5rem;align-items:center;justify-content:space-between;padding-block:.5rem}
.brand{font-weight:800}
nav{display:flex;gap:.25rem;margin-inline:-.6rem}
nav a{padding:.45rem .6rem;border-radius:6px;color:var(--muted);text-decoration:none;font-weight:600;font-size:.95rem}
nav a:hover{color:var(--ink)}
nav a[aria-current]{background:var(--pen-soft);color:var(--pen)}
.theme-btn{display:grid;place-items:center;width:40px;height:40px;border:1.5px solid var(--rule);border-radius:8px;background:var(--surface);color:var(--muted);cursor:pointer;padding:0}
.theme-btn:hover{color:var(--ink);border-color:var(--pen)}
.theme-btn svg{width:20px;height:20px}
.theme-btn .sun{display:none}
:root[data-theme="dark"] .theme-btn .sun{display:block}:root[data-theme="dark"] .theme-btn .moon{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .theme-btn .sun{display:block}:root:not([data-theme="light"]) .theme-btn .moon{display:none}}
main{padding-block:1.75rem 4rem}
.stack{display:grid;gap:1.75rem}
.stack>*{min-width:0}
.tight{display:grid;gap:.6rem}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
.btn{border:1.5px solid var(--rule);background:var(--surface);border-radius:8px;padding:.6rem 1rem;font-weight:600;cursor:pointer;min-height:44px}
.btn:hover{border-color:var(--pen)}
.btn.main{background:var(--pen);border-color:var(--pen);color:var(--on-pen)}
.btn:disabled{opacity:.45;cursor:default}
.btn.on{background:var(--pen-soft);border-color:var(--pen);color:var(--pen)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5rem,1fr));gap:0;border-block:1px solid var(--rule)}
.facts div{padding:.8rem .9rem .8rem 0}
.facts b{display:block;font:600 1.25rem/1.3 var(--mono)}
.facts span{color:var(--muted);font-size:.92rem}
.weights{display:flex;gap:3px;height:2.4rem}
.weights span{display:grid;place-items:center;background:var(--pen);color:var(--on-pen);font:600 .9rem var(--mono);min-width:0;border-radius:3px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.97rem}
th,td{text-align:left;padding:.55rem .9rem .55rem 0;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:.88rem}
td.n,th.n{text-align:right;white-space:nowrap}td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
ol.plan,ul.plain{margin:0;padding-left:1.3rem;display:grid;gap:.4rem;max-width:68ch}
.notice{background:var(--flag-soft);border-radius:8px;padding:1rem 1.1rem;display:grid;gap:.35rem}
.notice h3{color:var(--flag)}
input[type=search],select{border:1.5px solid var(--rule);background:var(--surface);border-radius:8px;padding:.55rem .8rem;min-height:44px;max-width:100%}
input[type=search]{flex:1 1 14rem;min-width:0}
/* notes */
.note{display:grid;gap:.5rem;align-content:start}
.pairs{display:grid}
.pair{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.2fr);gap:.2rem 1.25rem;padding:.6rem 0;border-bottom:1px solid var(--rule);align-items:start}
.pair .ans{font-weight:600;color:var(--pen);text-align:left;background:none;border:0;padding:.15rem .3rem;margin-left:-.3rem;border-radius:5px}
.pair .more{display:block;font-weight:400;color:var(--muted);font-size:.92rem;line-height:1.45;margin-top:.2rem}
.cover .pair .ans:not(.open) .more{color:transparent}
.note .intro{max-width:72ch}
.note .tip{background:var(--flag-soft);border-radius:8px;padding:.6rem .85rem;max-width:none;font-size:.95rem}
.note .tip b{color:var(--flag)}
.cover .pair .ans{cursor:pointer}
.cover .pair .ans:not(.open){background:var(--pen-soft);color:transparent;user-select:none}
.cover .pair .ans:not(.open):hover{background:var(--rule)}
/* question */
.qgrid{display:grid;gap:1.75rem;grid-template-columns:minmax(0,1fr)}
@media(min-width:900px){.qgrid.two{grid-template-columns:minmax(0,1fr) 17.5rem}}
.q{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:clamp(1rem,3vw,1.75rem);display:grid;gap:1.1rem;align-content:start;align-self:start}
.qmeta{display:flex;flex-wrap:wrap;gap:.2rem 1rem;justify-content:space-between;color:var(--muted);font-size:.92rem}
.stem{font-size:1.15rem;line-height:1.5;font-weight:600}
.opts{display:grid;gap:.5rem}
.opt{display:grid;grid-template-columns:2rem minmax(0,1fr);gap:.8rem;align-items:center;text-align:left;background:none;border:1.5px solid var(--rule);border-radius:8px;padding:.6rem .8rem;cursor:pointer;min-height:48px}
.opt:hover:not(:disabled){border-color:var(--pen)}
.opt i{font:600 .95rem/1 var(--mono);font-style:normal;width:2rem;height:2rem;border:1.5px solid var(--muted);border-radius:50%;display:grid;place-items:center}
.opt[aria-pressed=true]{border-color:var(--ink)}
.opt[aria-pressed=true] i{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right i{background:var(--good);border-color:var(--good);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong i{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt small{display:block;font-weight:600;font-size:.85rem}
.opt.right small{color:var(--good)}.opt.wrong small{color:var(--bad)}
.why{border-top:1px solid var(--rule);padding-top:1rem;display:grid;gap:.3rem}
.ok{color:var(--good)}.no{color:var(--bad)}
/* answer sheet */
.sheet{display:grid;gap:.9rem;align-content:start}
.bubbles{display:grid;grid-template-columns:repeat(auto-fill,minmax(2.3rem,1fr));gap:.35rem}
.bub{aspect-ratio:1;max-width:100%;border-radius:50%;border:1.5px solid var(--muted);background:none;font:600 .85rem var(--mono);cursor:pointer;padding:0;position:relative}
.bub.done{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.bub.flag::after{content:"";position:absolute;top:-2px;right:-2px;width:.75rem;height:.75rem;border-radius:50%;background:var(--flag);border:2px solid var(--bg)}
.bub[aria-current]{outline:3px solid var(--pen);outline-offset:2px}
.timer{font:600 1.6rem/1 var(--mono);font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.confirm{background:var(--flag-soft);border-radius:8px;padding:.9rem 1rem;display:grid;gap:.7rem}
.pick{display:grid;gap:.75rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,15rem),1fr))}
.pick .btn{display:grid;gap:.15rem;text-align:left;padding:1rem;font-weight:400}
.pick .btn b{font-size:1.1rem}
.score{font:600 3rem/1 var(--mono)}
.bar{height:.6rem;background:var(--rule);border-radius:3px;overflow:hidden;min-width:5rem}
.bar i{display:block;height:100%;background:var(--pen)}
@media(max-width:560px){
  h1{font-size:1.5rem}
  .pair{grid-template-columns:minmax(0,1fr)}
  nav a{padding:.45rem .5rem;font-size:.9rem}
  .btn.grow{flex:1}
}
</style>
<header class="top"><div class="wrap"><span class="brand">Cloud Practitioner Reviewer</span>
<nav aria-label="Sections"><a href="#overview">Overview</a><a href="#notes">Notes</a><a href="#practice">Practice</a><a href="#exam">Mock exam</a></nav><button type="button" class="theme-btn" id="themeBtn" aria-label="Switch to dark mode" title="Toggle dark mode"><svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button></div></header>
<main class="wrap" id="app"></main>
<script>
// [set, domain, topic, question, [correct...], [wrong...], explanation]
const RAW = [
// ---------- SET A, DOMAIN 1 (16) ----------
["A",1,"Benefits of the cloud","A development team used to wait six weeks for new servers. On AWS, the team creates test environments in minutes and deletes them the same day. Which benefit of the AWS Cloud does this show?",["Agility"],["High availability","Fault tolerance","Data durability"],"Agility is the speed at which you can get resources, experiment and move on. High availability and fault tolerance are about staying up when something fails. Durability is about not losing data."],
["A",1,"Benefits of the cloud","A game studio in Manila wants players in Brazil and Japan to have low latency. It does not want to build data centers in those countries. Which advantage of cloud computing applies?",["Go global in minutes"],["Benefit from massive economies of scale","Trade fixed expense for variable expense","Stop guessing capacity"],"You can deploy into other AWS Regions with a few clicks, which is the 'go global in minutes' advantage."],
["A",1,"Cloud economics","AWS buys and runs infrastructure for a very large number of customers and can therefore charge lower pay-as-you-go prices. What is this concept called?",["Economies of scale"],["Rightsizing","Consolidated billing","Elastic pricing"],"Aggregated usage from many customers gives AWS higher economies of scale, which turns into lower prices. Consolidated billing combines the bills of your own accounts."],
["A",1,"Benefits of the cloud","A ticketing website needs 40 servers on concert sale days and only 3 on normal days. Which cloud characteristic lets the number of servers follow demand up and down?",["Elasticity"],["Durability","Loose coupling","Data sovereignty"],"Elasticity means acquiring resources when you need them and releasing them when you do not."],
["A",1,"Benefits of the cloud","A company bought enough servers for its yearly peak. They sit mostly idle for the other eleven months. Which AWS Cloud advantage directly solves this?",["Stop guessing capacity"],["Go global in minutes","Increase operational overhead","Gain physical control of hardware"],"In the cloud you scale to what you actually need, so you avoid both idle capacity and shortage."],
["A",1,"Cloud economics","Instead of paying a large amount for hardware before knowing how it will be used, a startup pays each month only for what it consumed. Which advantage of cloud computing is this?",["Trade fixed expense for variable expense"],["Trade variable expense for fixed expense","Increase speed and agility","Stop guessing capacity"],"Upfront hardware is a fixed (capital) expense. Pay-as-you-go consumption is a variable expense. Watch for the reversed option in the exam."],
["A",1,"Well-Architected Framework","A team moves to more energy-efficient instance types and shuts down unused resources to reduce the environmental impact of its workload. Which Well-Architected pillar is this?",["Sustainability"],["Cost optimization","Operational excellence","Performance efficiency"],"Environmental impact is the keyword for sustainability. If the stated goal were lowering the bill, the answer would be cost optimization."],
["A",1,"Well-Architected Framework","A workload runs in several Availability Zones and automatically replaces failed instances so it can recover from disruptions. Which Well-Architected pillar does this represent?",["Reliability"],["Security","Performance efficiency","Operational excellence"],"Recovering from failure and continuing to meet demand is reliability."],
["A",1,"Well-Architected Framework","A team makes small, reversible changes, documents runbooks and reviews every incident to improve its procedures. Which Well-Architected pillar does this represent?",["Operational excellence"],["Reliability","Sustainability","Cost optimization"],"Running and monitoring systems and continually improving processes and procedures is operational excellence."],
["A",1,"Design principles","An order service places messages in a queue, and a payment service reads them later. If the payment service goes down, orders are still accepted. Which design principle is this?",["Loose coupling"],["Vertical scaling","Rightsizing","Single tenancy"],"Loosely coupled components can fail or scale independently. A queue such as Amazon SQS between components is the typical example."],
["A",1,"Cloud Adoption Framework","Which AWS Cloud Adoption Framework (AWS CAF) perspective focuses on culture, organizational change, leadership and workforce skills?",["People"],["Platform","Governance","Operations"],"The six perspectives are Business, People, Governance, Platform, Security and Operations. Skills and culture belong to People."],
["A",1,"Migration strategies","A company must leave its data center quickly. It moves its virtual machines to Amazon EC2 without changing the applications. Which migration strategy is this?",["Rehost"],["Refactor","Repurchase","Retain"],"Rehost is 'lift and shift'. Refactor means redesigning the application, and repurchase means moving to a different product, usually SaaS."],
["A",1,"Migration strategies","A company retires its self-hosted customer management system and subscribes to a SaaS product that does the same job. Which migration strategy is this?",["Repurchase"],["Replatform","Rehost","Relocate"],"Repurchase ('drop and shop') swaps the existing product for another one, often SaaS."],
["A",1,"Cloud economics","A company already owns software licenses that are eligible for use in the cloud. Which licensing approach lets it keep using them on AWS instead of paying for new ones?",["Bring Your Own License (BYOL)"],["License included","Consolidated billing","Savings Plans"],"BYOL reuses licenses you already own. 'License included' means the license cost is part of the AWS hourly price."],
["A",1,"Cloud economics","Which costs of an on-premises environment should a company include when it compares total cost of ownership with AWS? (Choose two.)",["Data center power and cooling","Server hardware replacement"],["Salaries of the sales team","Design of the company logo","End users' home internet bills"],"Running your own data center includes hardware, refresh cycles, power, cooling, space and the staff who maintain it."],
["A",1,"Cloud economics","Monitoring shows that an instance uses only 8% of its CPU and memory. The company moves the workload to a smaller instance type that still meets its needs. What is this practice called?",["Rightsizing"],["Replatforming","Bursting","Load balancing"],"Rightsizing matches instance types and sizes to real performance needs at the lowest cost. AWS Compute Optimizer can recommend the changes."],

// ---------- SET A, DOMAIN 2 (19) ----------
["A",2,"Shared responsibility","Which tasks are the responsibility of AWS under the shared responsibility model? (Choose two.)",["Patching the hypervisor on the host","Securely disposing of old storage devices"],["Configuring security groups","Patching the guest OS on Amazon EC2","Classifying the customer's data"],"AWS is responsible for security OF the cloud: facilities, hardware, networking and the virtualization layer. Everything the customer configures or stores is security IN the cloud."],
["A",2,"Shared responsibility","A company runs a web server on an Amazon EC2 instance. Who is responsible for installing security patches on the instance's operating system?",["The company"],["AWS","AWS and the company together","The operating system vendor"],"EC2 is infrastructure as a service, so the customer manages the guest operating system. AWS manages the physical host and hypervisor."],
["A",2,"Shared responsibility","A company uses Amazon RDS for MySQL. Which task remains the customer's responsibility?",["Controlling network access with security groups"],["Patching the underlying operating system","Replacing failed database hardware","Installing the database engine software"],"RDS is a managed service, so AWS handles the OS, engine installation and hardware. The customer still controls access, data and settings."],
["A",2,"Shared responsibility","Which item is the customer responsible for when using AWS Lambda?",["The function code and its IAM permissions"],["Patching the operating system of the servers","Scaling the servers that run the code","Physical security of the compute hosts"],"With serverless compute, AWS manages servers, operating systems and scaling. The customer keeps responsibility for code, data and access."],
["A",2,"Shared responsibility","Which of the following is a shared control, where AWS and the customer each handle their own part?",["Patch management"],["Data center access control","Media destruction","Zone security"],"Shared controls include patch management, configuration management, and awareness and training. Physical controls are inherited from AWS, and zone security is customer specific."],
["A",2,"Compliance","An auditor asks for the AWS SOC 2 report. Where can the company download it?",["AWS Artifact"],["AWS Config","AWS Trusted Advisor","Amazon Inspector"],"AWS Artifact gives on-demand access to AWS compliance reports and agreements."],
["A",2,"Logging and auditing","An administrator needs to find out which IAM user terminated an Amazon EC2 instance yesterday. Which AWS service should the administrator use?",["AWS CloudTrail"],["Amazon CloudWatch","AWS Config","Amazon GuardDuty"],"CloudTrail records API activity: who did what, when and from where. CloudWatch handles metrics, logs and alarms."],
["A",2,"Logging and auditing","A company wants to track configuration changes to its resources over time and check them against rules, such as 'all EBS volumes must be encrypted'. Which AWS service should it use?",["AWS Config"],["AWS CloudTrail","Amazon Macie","AWS Systems Manager"],"AWS Config records resource configuration history and evaluates it against rules. CloudTrail answers who made the API call."],
["A",2,"Security services","Which AWS service continuously analyzes sources such as CloudTrail events, VPC Flow Logs and DNS logs to detect malicious activity in an account?",["Amazon GuardDuty"],["Amazon Inspector","AWS Shield","AWS WAF"],"GuardDuty is intelligent threat detection. Inspector looks for software vulnerabilities, not attackers."],
["A",2,"Security services","A company wants automatic scans of its Amazon EC2 instances and container images for known software vulnerabilities. Which AWS service should it use?",["Amazon Inspector"],["Amazon GuardDuty","Amazon Detective","AWS Artifact"],"Vulnerability scanning is Inspector. It covers EC2 instances, container images in Amazon ECR and Lambda functions."],
["A",2,"Security services","A company wants to find out whether its Amazon S3 buckets contain personally identifiable information (PII). Which AWS service should it use?",["Amazon Macie"],["AWS KMS","Amazon Inspector","Amazon Cognito"],"Macie uses machine learning and pattern matching to discover sensitive data in Amazon S3."],
["A",2,"Security services","Which AWS service is designed to protect applications against distributed denial of service (DDoS) attacks?",["AWS Shield"],["AWS WAF","Amazon Macie","AWS Firewall Manager"],"Shield Standard is automatic and free. Shield Advanced adds extra protection and access to a response team for a fee."],
["A",2,"Security services","A website behind an Application Load Balancer must block SQL injection and cross-site scripting requests. Which AWS service should the company use?",["AWS WAF"],["AWS Shield","Network ACLs","Amazon GuardDuty"],"WAF is a web application firewall that filters HTTP(S) requests with rules. Network ACLs filter by IP, port and protocol only."],
["A",2,"Encryption","Which AWS service lets customers create and control the keys that are used to encrypt their data across AWS services?",["AWS Key Management Service (AWS KMS)"],["AWS Certificate Manager (ACM)","AWS Secrets Manager","AWS Artifact"],"KMS manages encryption keys. ACM manages TLS certificates, and Secrets Manager stores credentials."],
["A",2,"Encryption","A company wants to encrypt data in transit between users and its website with HTTPS. Which AWS service provides and renews the TLS certificates?",["AWS Certificate Manager (ACM)"],["AWS Key Management Service (AWS KMS)","AWS Secrets Manager","Amazon Cognito"],"ACM provisions, manages and renews SSL/TLS certificates, which protect data in transit."],
["A",2,"IAM","A security team gives each user only the permissions required to perform that user's job. Which principle is the team following?",["Least privilege"],["Shared responsibility","Defense in depth","Federation"],"Least privilege means granting only the permissions that are needed, and nothing more."],
["A",2,"IAM","An application on Amazon EC2 needs to read objects in Amazon S3. What is the most secure way to give it access?",["Attach an IAM role to the instance"],["Store access keys in the application code","Make the S3 bucket public","Use the root user's access keys"],"A role gives the instance temporary credentials that rotate automatically, so no long-term keys are stored."],
["A",2,"Root user","Which actions are best practices for protecting the AWS account root user? (Choose two.)",["Turn on multi-factor authentication (MFA)","Avoid creating root user access keys"],["Share the password with the security team","Use the root user for daily administration","Reuse a password from another account"],"Protect the root user with MFA and a strong unique password, do not create access keys for it, and use it only for the few tasks that require it."],
["A",2,"Access management","Employees must sign in once with their corporate credentials and then reach many AWS accounts. Which AWS service should the company use?",["AWS IAM Identity Center"],["Amazon Cognito","AWS Directory Service","AWS Secrets Manager"],"IAM Identity Center gives the workforce single sign-on across AWS accounts and applications. Cognito is for customers signing in to your app."],

// ---------- SET A, DOMAIN 3 (22) ----------
["A",3,"Global infrastructure","Which factors should a company consider when it chooses an AWS Region? (Choose two.)",["Data residency requirements","Distance to its users"],["The number of IAM users it has","The programming language of its app","The age of its AWS account"],"The common factors are compliance, latency to users, available services and price."],
["A",3,"Global infrastructure","What is an Availability Zone?",["One or more discrete data centers with redundant power and networking"],["A group of Regions that share one set of data centers worldwide","A site that caches content close to end users","A private network that belongs to one customer"],"A Region contains multiple isolated Availability Zones, and each zone is one or more data centers. Edge locations cache content, and a VPC is your private network."],
["A",3,"Networking","A news website wants to deliver images and videos to global readers with low latency by caching them near the readers. Which AWS service should it use?",["Amazon CloudFront"],["AWS Global Accelerator","Amazon Route 53","AWS Direct Connect"],"CloudFront is a content delivery network that caches content at edge locations. Global Accelerator speeds up network paths but does not cache."],
["A",3,"Deployment methods","A team wants to describe its whole infrastructure in a template file and deploy identical copies in several Regions. Which AWS service should it use?",["AWS CloudFormation"],["AWS CloudTrail","AWS Config","Amazon CloudWatch"],"CloudFormation is infrastructure as code (IaC). It makes deployments repeatable and consistent."],
["A",3,"Compute","A developer wants to upload web application code and have AWS handle the capacity, load balancing, scaling and health monitoring. Which AWS service fits best?",["AWS Elastic Beanstalk"],["Amazon EC2","AWS Batch","AWS Outposts"],"Elastic Beanstalk deploys and runs your web application, while you keep access to the underlying resources."],
["A",3,"Compute","A company runs video encoding and scientific modeling jobs that need high-performance processors. Which Amazon EC2 instance family fits best?",["Compute optimized"],["Memory optimized","Storage optimized","General purpose"],"Compute optimized instances suit CPU-heavy work. Memory optimized suits large in-memory datasets, and storage optimized suits heavy disk reads and writes."],
["A",3,"Compute","Code must run for a few seconds each time an image is uploaded to Amazon S3. The company does not want to manage servers or pay for idle time. Which AWS service should it use?",["AWS Lambda"],["Amazon EC2","Amazon Lightsail","AWS Elastic Beanstalk"],"Lambda runs code in response to events and charges for requests and run time only."],
["A",3,"Containers","A company runs containers on Amazon ECS and does not want to provision or manage the servers underneath. Which AWS service should it use?",["AWS Fargate"],["Amazon EC2 Auto Scaling","Amazon ECR","AWS Batch"],"Fargate is serverless compute for containers and works with ECS and EKS. ECR only stores container images."],
["A",3,"Compute","A web application on Amazon EC2 must spread traffic across instances and add instances automatically when demand rises. Which services or features should be used together? (Choose two.)",["Elastic Load Balancing","Amazon EC2 Auto Scaling"],["AWS Direct Connect","Amazon Inspector","AWS Storage Gateway"],"The load balancer distributes traffic, and Auto Scaling adjusts the number of instances."],
["A",3,"Databases","A company wants to run PostgreSQL without handling backups, patching or failover itself. Which AWS service should it use?",["Amazon RDS"],["Amazon DynamoDB","Amazon Redshift","PostgreSQL on Amazon EC2"],"RDS is a managed relational database service. Running PostgreSQL on EC2 leaves all of the administration to you."],
["A",3,"Databases","A mobile game needs a serverless key-value database with single-digit millisecond response times at any scale. Which AWS service should it use?",["Amazon DynamoDB"],["Amazon Aurora","Amazon Neptune","Amazon Redshift"],"DynamoDB is the serverless NoSQL key-value and document database."],
["A",3,"Databases","A database receives the same read queries again and again. Which AWS service can store the results in memory to reduce latency and database load?",["Amazon ElastiCache"],["Amazon EFS","AWS Glue","Amazon DocumentDB"],"ElastiCache is an in-memory cache compatible with Valkey, Redis OSS and Memcached."],
["A",3,"Networking","Instances in a private subnet must download updates from the internet, but the internet must not be able to start connections to them. Which VPC component is needed?",["NAT gateway"],["Internet gateway only","VPC peering connection","Virtual private gateway"],"A NAT gateway allows outbound connections from private subnets and blocks connections started from the internet."],
["A",3,"Networking","Which AWS service translates domain names such as example.com into IP addresses and can route users to healthy endpoints?",["Amazon Route 53"],["Amazon CloudFront","Elastic Load Balancing","Amazon API Gateway"],"Route 53 is the managed DNS service. It also registers domains and performs health checks."],
["A",3,"Networking","A bank needs a dedicated, private network connection from its data center to AWS that does not use the public internet. Which AWS service should it use?",["AWS Direct Connect"],["AWS Site-to-Site VPN","AWS Client VPN","Amazon CloudFront"],"Direct Connect is a dedicated physical line. VPN connections are encrypted but travel over the internet."],
["A",3,"Storage","Records must be kept for 10 years at the lowest storage cost. They are almost never read, and a retrieval time of up to 12 hours or more is acceptable. Which Amazon S3 storage class fits?",["S3 Glacier Deep Archive"],["S3 Glacier Instant Retrieval","S3 One Zone-IA","S3 Standard"],"Deep Archive has the lowest storage price and the slowest retrieval. Glacier Instant Retrieval returns data in milliseconds and costs more to store."],
["A",3,"Storage","Which AWS service provides persistent block storage volumes that attach to Amazon EC2 instances?",["Amazon EBS"],["Amazon S3","Amazon EFS","AWS Storage Gateway"],"EBS is block storage. S3 is object storage and EFS is file storage."],
["A",3,"Storage","Hundreds of Linux instances across several Availability Zones must share the same file system at the same time. Which AWS service should be used?",["Amazon EFS"],["Amazon EBS","EC2 instance store","Amazon S3 Glacier"],"EFS is a shared, elastic NFS file system for Linux. For Windows file shares or Lustre, look for Amazon FSx."],
["A",3,"Analytics","An analyst wants to run standard SQL queries directly on files in Amazon S3 without setting up servers. Which AWS service should the analyst use?",["Amazon Athena"],["Amazon Redshift","Amazon EMR","Amazon Kinesis"],"Athena is serverless SQL on S3. Redshift is a data warehouse that you load data into."],
["A",3,"AI and ML","A company wants to build a chatbot that understands typed or spoken customer requests. Which AWS service is designed for this?",["Amazon Lex"],["Amazon Polly","Amazon Comprehend","Amazon Rekognition"],"Lex builds conversational interfaces. Polly turns text into speech, Comprehend analyzes text and Rekognition analyzes images."],
["A",3,"Application integration","When an order is placed, one message must be pushed at once to email, SMS and several other subscribers. Which AWS service should be used?",["Amazon SNS"],["Amazon SQS","AWS Step Functions","Amazon Connect"],"SNS pushes one message to many subscribers (publish/subscribe). SQS holds messages in a queue until a consumer pulls them."],
["A",3,"End-user computing","Remote staff need a full cloud desktop that keeps their files and settings between sessions. Which AWS service should the company use?",["Amazon WorkSpaces"],["Amazon AppStream 2.0","AWS Amplify","Amazon Lightsail"],"WorkSpaces provides virtual desktops. AppStream 2.0 streams individual applications to a browser."],

["A",4,"Pricing models","A company will commit to a steady hourly spend for three years. It wants a discount that applies across Amazon EC2, AWS Fargate and AWS Lambda. Which option should it choose?",["Compute Savings Plans"],["Standard Reserved Instances","Spot Instances","EC2 Instance Savings Plans"],"Compute Savings Plans are the most flexible and cover EC2, Fargate and Lambda. EC2 Instance Savings Plans are tied to one instance family in one Region."],

["A",4,"Cost management","Before migrating, a company wants to estimate the monthly cost of a planned AWS architecture. Which tool should it use?",["AWS Pricing Calculator"],["AWS Cost Explorer","AWS Budgets","AWS Trusted Advisor"],"The Pricing Calculator estimates costs before you build. Cost Explorer analyzes costs you have already incurred."],
["A",4,"AWS Organizations","What are benefits of consolidated billing in AWS Organizations? (Choose two.)",["One bill for multiple accounts","Combined usage for volume discounts"],["All accounts merge into one account","Free Enterprise Support for every account","IAM is no longer needed in the accounts"],"Accounts remain separate, but the bill and the usage are combined. Reserved Instance and Savings Plans discounts can also be shared."],
["A",4,"AWS Support","Which is the lowest-priced AWS Support plan that includes a designated Technical Account Manager (TAM)?",["AWS Enterprise Support"],["Basic Support","AWS Business Support+","AWS Unified Operations"],"Enterprise Support includes a designated TAM. Unified Operations also has one, but costs far more. Basic and Business Support+ do not include a designated TAM."],
["A",4,"AWS Marketplace","A company wants to buy a third-party firewall product that runs on AWS and have the charge appear on its AWS bill. Where should it look?",["AWS Marketplace"],["AWS Artifact","AWS re:Post","AWS Service Catalog"],"Marketplace is the catalog of third-party software from independent vendors. Service Catalog is for products your own company has approved."],

["B",1,"Benefits of the cloud","A company wants its application to keep running even if one entire data center fails. Which approach provides this high availability?",["Deploy across multiple Availability Zones"],["Use a larger instance in one Availability Zone","Enable AWS CloudTrail in one Region","Buy a Reserved Instance in one Availability Zone"],"Availability Zones do not share single points of failure, so spreading across them provides high availability."],

["B",1,"Well-Architected Framework","A company enables traceability, protects data in transit and at rest, and applies strong identity controls. Which Well-Architected pillar is this?",["Security"],["Reliability","Operational excellence","Performance efficiency"],"Identity, traceability and data protection are design principles of the security pillar."],
["B",1,"Well-Architected Framework","Which AWS tool helps a team review its workload against AWS architectural best practices and lists the improvements to make?",["AWS Well-Architected Tool"],["AWS Pricing Calculator","AWS Service Catalog","AWS Artifact"],"The Well-Architected Tool reviews workloads against the framework's pillars."],
["B",1,"Cloud Adoption Framework","Which AWS CAF perspective focuses on managing cloud initiatives, maximizing benefits and minimizing transformation-related risks?",["Governance"],["Platform","People","Operations"],"Governance covers program, risk and cloud financial management. Platform covers architecture and engineering."],
["B",1,"Cloud Adoption Framework","Which business outcomes does the AWS Cloud Adoption Framework (AWS CAF) help organizations achieve? (Choose two.)",["Reduced business risk","Improved ESG performance"],["Guaranteed zero downtime","No more compliance audits","Free technical support"],"The four outcomes are reduced business risk, improved environmental, social and governance (ESG) performance, increased revenue and increased operational efficiency."],
["B",1,"Migration strategies","A company redesigns its single large application into serverless microservices to gain agility. Which migration strategy is this?",["Refactor"],["Rehost","Replatform","Retire"],"Refactor (re-architect) changes the application's architecture to use cloud-native features."],

["B",1,"Migration strategies","An application depends on special on-premises hardware and cannot move until next year. The company leaves it where it is for now. Which migration strategy is this?",["Retain"],["Retire","Relocate","Rehost"],"Retain means keep it in place and revisit it later. Retire means turn it off for good."],
["B",1,"Migration strategies","A company must migrate a production database with minimal downtime by keeping the source and target in sync during the migration. Which AWS service supports this?",["AWS Database Migration Service (AWS DMS)"],["AWS Backup","Migration Evaluator","AWS Application Discovery Service"],"DMS supports ongoing replication, so the source database stays in use until cutover."],
["B",1,"Cloud economics","Which of these is an example of a variable expense?",["Paying per second for instances only while they run"],["Buying rack servers for the next five years","Signing a ten-year data center lease","Purchasing a perpetual software license"],"Variable expenses rise and fall with use. The other options are paid regardless of use."],
["B",1,"Cloud economics","What is a main benefit of automating infrastructure deployments?",["Consistent results with fewer human errors"],["No further need for monitoring","Unlimited capacity at no cost","Automatic compliance with every law"],"Automation replaces manual, one-time steps with repeatable processes, which reduces errors and saves staff time."],
["B",1,"Design principles","To handle more traffic, a team adds more instances behind a load balancer instead of moving to one larger instance. What is this called?",["Horizontal scaling"],["Vertical scaling","Rightsizing","Failover"],"Horizontal scaling (scaling out) adds more resources. Vertical scaling (scaling up) makes one resource larger."],

["B",2,"Shared responsibility","A company stores files in Amazon S3. Which task is the company responsible for?",["Setting bucket policies and access permissions"],["Replacing failed storage drives","Patching the servers that run Amazon S3","Maintaining the facility's power supply"],"AWS runs the storage infrastructure. The customer decides who can access the data."],

["B",2,"Security services","Which AWS service checks an account against best practices, such as unrestricted security group ports or a root user without MFA?",["AWS Trusted Advisor"],["AWS Artifact","Amazon Macie","AWS Shield"],"Trusted Advisor checks cost optimization, performance, security, fault tolerance, service limits and operational excellence."],

["B",2,"Governance","A company wants to prevent every account in its organization from using AWS Regions outside Asia. Which feature should it use?",["Service control policies (SCPs)"],["IAM groups","Cost allocation tags","Security groups"],"SCPs in AWS Organizations set the maximum permissions for accounts. They restrict but do not grant access."],
["B",2,"Compliance","A hospital must meet healthcare regulations for a workload on AWS. Which statement is correct?",["It must use in-scope services and also apply its own controls"],["Any workload on AWS is compliant automatically","AWS Support enables compliance on request","Compliance applies only to on-premises systems"],"AWS compliance covers the infrastructure and the services in scope. The customer is still responsible for configuring the workload correctly."],
["B",2,"Credential storage","A developer accidentally published an IAM user's access key in a public code repository. What should be done first?",["Deactivate the exposed key"],["Rename the IAM user","Make the repository private and keep the key","Wait for the monthly bill"],"Treat a published key as compromised: deactivate it, create a replacement if needed and review activity in CloudTrail. Making the repository private is too late."],

["Deploy close to users in other countries with a few clicks","Go global in minutes","Lower latency and a better experience for users worldwide."]]},
{d:1,t:"Words that look alike",k:"pairs",rows:[
["Scales up and down automatically with demand","Elasticity","Usually automatic, for example EC2 Auto Scaling. Key phrase: demand rises and falls."],
["Can grow to handle more load","Scalability","Can be manual. Elasticity is scalability that also shrinks back automatically."],
["Stays up with little downtime, usually through multiple Availability Zones","High availability","A short interruption during failover is acceptable."],
["Keeps working with no interruption when a component fails","Fault tolerance","Stricter than high availability. Needs redundant components running at the same time."],
["Data is not lost over time","Durability","Amazon S3 is designed for 99.999999999% (11 nines) durability."],
["Performs its function correctly and recovers from failure","Reliability","Also the name of a Well-Architected pillar."],
["Fast to build, test and change","Agility","Time to get resources drops from weeks to minutes."],
["Add more instances","Horizontal scaling (scale out)","Preferred in the cloud because it removes single points of failure."],
["Use a bigger instance","Vertical scaling (scale up)","Has an upper limit and usually needs a restart."],
["Components talk through a queue so each can fail or scale alone","Loose coupling","Amazon SQS between two services is the classic example."],
["Recovers systems and data after a major event","Disaster recovery","Strategies from cheapest and slowest to most expensive and fastest: backup and restore, pilot light, warm standby, multi-site active-active."]]},
{d:1,t:"Well-Architected pillars",k:"pairs",
intro:"The AWS Well-Architected Framework has six pillars. Questions give a goal or practice and ask which pillar it belongs to. The detail lines are the pillar's design principles.",
tip:"Cost optimization is about the bill. Sustainability is about energy and environmental impact. Performance efficiency is about using the right resources as demand and technology change.",rows:[
["Runbooks, small reversible changes, learning from incidents","Operational excellence","Perform operations as code, make frequent small reversible changes, refine procedures often, anticipate failure, learn from all operational failures."],
["Identity, traceability, data protection","Security","Strong identity foundation, traceability, security at all layers, automated security, protect data in transit and at rest, keep people away from data, prepare for security events."],
["Recovers from failure, meets demand, Multi-AZ","Reliability","Automatically recover from failure, test recovery procedures, scale horizontally, stop guessing capacity, manage change through automation."],
["Uses the right resources efficiently, adopts serverless and new technology","Performance efficiency","Democratize advanced technologies, go global in minutes, use serverless architectures, experiment more often."],
["Avoids unneeded cost, analyzes spending","Cost optimization","Adopt a consumption model, measure overall efficiency, stop spending on undifferentiated heavy lifting, analyze and attribute expenditure."],
["Reduces environmental impact","Sustainability","Understand your impact, set goals, maximize utilization, adopt more efficient hardware and software, use managed services."],
["Reviews a workload against the six pillars and lists improvements","AWS Well-Architected Tool","Free in the console. Lenses add guidance for specific workloads, such as serverless."]]},
{d:1,t:"Cloud design principles",k:"pairs",rows:[
["Replace a broken server instead of repairing it","Disposable resources (cattle, not pets)","Launch from templates or machine images so a failed server is replaced automatically."],
["Assume things will fail and build around it","Design for failure","Use multiple Availability Zones, health checks and automatic replacement."],
["Remove single points of failure","Redundancy","Run at least two of everything important, in different Availability Zones."],
["Let AWS run the undifferentiated work","Use managed services","For example Amazon RDS instead of a database on EC2, or Lambda instead of servers."],
["Split work so many resources handle it at the same time","Think parallel","Horizontal scaling, and batch jobs spread across many instances."],
["Replace manual steps with code","Automation","CloudFormation, Auto Scaling and CloudWatch alarms reduce manual work and human error."],
["Test on a full-size copy of production, then delete it","Test at production scale","You pay for the test environment only while it runs."]]},
{d:1,t:"Cloud Adoption Framework (AWS CAF)",k:"pairs",
intro:"AWS CAF groups capabilities into six perspectives. Business, People and Governance are the business side. Platform, Security and Operations are the technical side.",rows:[
["Aligns cloud investment with business goals","Business perspective","Typical stakeholders: CEO, CFO, COO, CIO, CTO."],
["Culture, skills, leadership, organizational change","People perspective","Bridges technology and business. Covers training, workforce transformation and change management."],
["Risk, benefits and financial management","Governance perspective","Program and project management, risk management, cloud financial management."],
["Architecture, engineering, modern platforms","Platform perspective","Typical stakeholders: CTO, technology leaders, architects, engineers."],
["Confidentiality, integrity and availability of data","Security perspective","Typical stakeholders: CISO, compliance and audit leaders, security architects."],
["Running cloud services to meet business needs","Operations perspective","Typical stakeholders: infrastructure and operations leaders, site reliability engineers, IT service managers."],
["Four business outcomes","Reduced business risk, improved ESG performance, increased revenue, increased operational efficiency","ESG means environmental, social and governance."],
["Four transformation phases","Envision, Align, Launch, Scale","Envision: show how cloud speeds up outcomes. Align: find gaps and dependencies. Launch: deliver pilots in production. Scale: expand them across the business."],
["Four transformation domains","Technology, process, organization, product"]]},
{d:1,t:"The 7 Rs of migration",k:"pairs",
tip:"Watch for nicknames: lift and shift is rehost, lift, tinker and shift is replatform, drop and shop is repurchase.",rows:[
["Lift and shift, no changes","Rehost","Fastest way to leave a data center. Tool: AWS Application Migration Service. Optimize later."],
["A few optimizations, such as MySQL on a server to Amazon RDS","Replatform","Lift, tinker and shift. The core architecture stays the same."],
["Redesign as cloud-native, such as microservices","Refactor (re-architect)","Most effort and cost up front, most cloud benefit later."],
["Switch to another product, usually SaaS","Repurchase","Drop and shop. Often changes from a perpetual license to a subscription."],
["Move the hypervisor-level infrastructure, such as VMware, as is","Relocate","Example: VMware Cloud on AWS. No new hardware and no application changes."],
["Keep it on premises for now","Retain","Revisit later. Reasons include a recent investment, compliance, or dependencies that have not moved yet."],
["Turn it off","Retire","Removes the cost and security risk of applications nobody uses anymore."]]},
{d:1,t:"Migration tools",k:"pairs",
tip:"Minimal-downtime database move = AWS DMS. Different database engines = add AWS SCT. Too much data for the network = Snow Family.",rows:[
["Builds a data-driven business case for migrating","Migration Evaluator","Projects what your current servers would cost to run on AWS."],
["Discovers on-premises servers, usage and dependencies","AWS Application Discovery Service"],
["Tracks the progress of a migration in one place","AWS Migration Hub"],
["Moves servers to AWS through continuous replication","AWS Application Migration Service","The recommended rehost (lift and shift) tool. Short cutover window."],
["Moves databases, with ongoing replication","AWS Database Migration Service (AWS DMS)","The source stays in use during migration. Works for same-engine and different-engine moves."],
["Converts schema and database code between engines","AWS Schema Conversion Tool (AWS SCT)","Used with DMS when the engines differ, such as Oracle to Aurora PostgreSQL."],
["Online transfer of files from NFS or SMB shares to S3, EFS or FSx","AWS DataSync","Fast, scheduled and verified transfer over the network."],
["SFTP, FTPS or FTP uploads straight into S3 or EFS","AWS Transfer Family","Partners keep using the file transfer tools they already have."],
["A physical device shipped to you for offline transfer of very large data","AWS Snow Family (Snowball Edge)","Use when the network would take too long. Devices can also run compute at the edge."]]},
{d:1,t:"Cloud economics",k:"list",rows:[
"Fixed (capital) expense is paid upfront whatever you use. Variable expense follows use.",
"CapEx is money spent upfront on physical assets. OpEx is ongoing spending on services. The cloud moves spending from CapEx to OpEx.",
"Total cost of ownership (TCO) compares everything: hardware, software, facilities, power, cooling, networking, staff time and the cost of idle capacity.",
"On-premises cost includes hardware, refresh, power, cooling, space and maintenance staff.",
"Labor savings: AWS takes over racking servers, replacing disks and running data centers, so staff can work on applications instead.",
"Rightsizing means matching instance type and size to the real need. AWS Compute Optimizer recommends changes.",
"BYOL reuses licenses you own. License included puts the license in the AWS price. Licenses tied to physical sockets or cores need Dedicated Hosts.",
"There are no termination fees. Stop or delete a resource and its charges stop, though storage you keep is still billed.",
"Automation and infrastructure as code give repeatable results and fewer errors."]},

{d:2,t:"Shared responsibility by service",k:"table",
intro:"AWS handles security OF the cloud: facilities, hardware, network and the virtualization layer. The customer handles security IN the cloud: data, identities, settings, and anything installed on an instance. The more managed the service, the more AWS takes over.",
tip:"Your data, who can access it, and how it is classified and encrypted are always the customer's job, whatever the service.",
head:["Task","EC2","RDS","Lambda / S3 / DynamoDB"],rows:[
["Physical security, hardware, network","AWS","AWS","AWS"],
["Hypervisor","AWS","AWS","AWS"],
["Operating system patching","Customer","AWS","AWS"],
["Database engine or runtime patching","Customer","AWS","AWS"],
["Backups","Customer","Shared: AWS runs them, you set retention","Customer chooses (for example S3 Versioning)"],
["Application code","Customer","Customer","Customer"],
["Network access (security groups)","Customer","Customer","Customer (where used)"],
["IAM permissions","Customer","Customer","Customer"],
["Data classification","Customer","Customer","Customer"],
["Data, and encryption choices","Customer","Customer","Customer"]]},
{d:2,t:"Types of controls",k:"pairs",rows:[
["Physical and environmental","Inherited from AWS","Customers fully inherit these. There is nothing for the customer to do."],
["Patch management, configuration management, awareness and training","Shared controls","AWS patches and trains for its infrastructure and staff. You patch your guest OS and apps and train your own staff."],
["Zone security, routing data within your own environment","Customer specific","Depends entirely on the customer's application and data."]]},
{d:2,t:"Compliance and governance",k:"pairs",
tip:"AWS being certified does not make your workload compliant. You must still use in-scope services and configure them correctly.",rows:[
["Download AWS compliance reports such as SOC, PCI and ISO","AWS Artifact","Artifact Agreements also lets you accept agreements such as a HIPAA BAA for an account or organization."],
["Collect audit evidence continuously and map it to frameworks","AWS Audit Manager","Helps prepare for audits against standards such as PCI DSS or GDPR."],
["Record resource settings over time and check them against rules","AWS Config","Conformance packs bundle many rules for one standard."],
["Set up and govern a secure multi-account environment","AWS Control Tower","Builds a landing zone and applies controls (guardrails) across accounts in AWS Organizations."],
["Group accounts and manage them centrally","AWS Organizations","Organizational units (OUs), consolidated billing and service control policies."],
["Limit what accounts in an organization can do","Service control policies (SCPs)","Never grant permissions. They affect member accounts, including their root users, but not the management account."],
["Approved catalog of products teams can deploy themselves","AWS Service Catalog"],
["Find resources shared with outside accounts, and check policies","IAM Access Analyzer"]]},
{d:2,t:"Logging and monitoring compared",k:"table",
intro:"CloudTrail is on by default and keeps 90 days of management events in Event history. Create a trail to keep logs longer in Amazon S3.",
head:["Service","Answers the question","Example"],rows:[
["AWS CloudTrail","Who did what, when and from where? (API calls)","Which user terminated this instance?"],
["Amazon CloudWatch","How is it performing? Metrics, logs, alarms, dashboards","Alarm and notify when CPU is above 80%"],
["AWS Config","What did the settings look like, and are they compliant?","Is every EBS volume encrypted?"],
["VPC Flow Logs","What IP traffic went to and from network interfaces?","Which addresses reached this subnet?"],
["AWS X-Ray","Where is a request slow across services?","Trace an API call through Lambda and DynamoDB"]]},
{d:2,t:"Security services by keyword",k:"pairs",
tip:"Detect threats = GuardDuty. Find vulnerabilities = Inspector. Find sensitive data = Macie. Investigate = Detective. Collect everything = Security Hub.",rows:[
["Detects threats from CloudTrail, VPC Flow Logs and DNS logs","Amazon GuardDuty","Turn it on and it works, with no agents. It detects but does not block."],
["Scans EC2, container images and Lambda for vulnerabilities","Amazon Inspector","Finds known software vulnerabilities (CVEs) and unintended network exposure."],
["Finds PII in Amazon S3","Amazon Macie","Uses machine learning and pattern matching. Works on S3 only."],
["Investigates the root cause of a finding","Amazon Detective","Builds a visual graph from logs after something is found."],
["Collects findings in one place","AWS Security Hub","Also runs automated best-practice checks across accounts."],
["DDoS protection","AWS Shield (Standard is free, Advanced is paid)","Standard protects every customer at layers 3 and 4. Advanced adds more protection, a 24/7 response team and cost protection for scaling during an attack."],
["Blocks SQL injection and cross-site scripting","AWS WAF","Layer 7 rules on CloudFront, Application Load Balancer, API Gateway and AppSync. Can also block IPs or countries and rate-limit."],
["Manages firewall rules across accounts","AWS Firewall Manager","Needs AWS Organizations. Covers WAF, Shield Advanced, security groups and Network Firewall."],
["Stateful firewall and intrusion prevention for a whole VPC","AWS Network Firewall"],
["Best-practice checks, such as open ports and missing root MFA","AWS Trusted Advisor","Categories: cost optimization, performance, security, fault tolerance, service limits, operational excellence. Basic Support gets only the core checks."]]},
{d:2,t:"Encryption and secrets",k:"pairs",rows:[
["Create and control encryption keys","AWS KMS","Works with most AWS services. Every use of a key is logged in CloudTrail."],
["Dedicated single-tenant hardware modules","AWS CloudHSM","You alone control the keys. Use when a rule requires dedicated, FIPS-validated hardware."],
["TLS certificates, encryption in transit","AWS Certificate Manager (ACM)","Public certificates are free with integrated services such as ELB and CloudFront, and renew automatically."],
["Store and automatically rotate database passwords","AWS Secrets Manager","Paid per secret. Built-in rotation for Amazon RDS and other databases."],
["Store configuration values and simple secrets","Systems Manager Parameter Store","Standard parameters are free. No built-in automatic rotation."],
["Data stored on disk","Encryption at rest","Examples: S3 (on by default for new objects), EBS volumes, RDS databases, using KMS keys."],
["Data moving over a network","Encryption in transit (TLS)","Examples: HTTPS with ACM certificates, VPN tunnels."],
["AWS encrypts data as it writes it to storage","Server-side encryption","S3 options include SSE-S3 (the default) and SSE-KMS."],
["Data is encrypted before it is sent to AWS","Client-side encryption","You manage the process and the keys. AWS only stores the encrypted data."]]},
{d:2,t:"Identity and access",k:"pairs",
intro:"IAM is global (not tied to a Region) and free. Everything is denied by default, and an explicit deny always wins over an allow.",
tip:"The root user, IAM users and access keys are long-term credentials. Roles give temporary credentials, which is why roles are the more secure answer.",rows:[
["One person or app with long-term credentials","IAM user","Can have a console password and access keys for the CLI and SDKs. Prefer Identity Center or roles for people."],
["Collection of users with the same permissions","IAM group","A user can be in several groups. Groups cannot contain other groups."],
["Temporary credentials for services, apps or other accounts","IAM role","Assumed through AWS STS. Use for EC2, Lambda, cross-account access and federation."],
["JSON document that allows or denies actions","IAM policy","Identity-based policies attach to users, groups and roles."],
["Policy attached to a resource, such as an S3 bucket","Resource-based policy","Can give access to other AWS accounts."],
["Second sign-in check besides a password","Multi-factor authentication (MFA)","Authenticator app, passkey or security key, or hardware token."],
["Rules for password length and complexity","IAM password policy"],
["List of all users and the status of their passwords, keys and MFA","IAM credential report"],
["Single sign-on for employees across accounts","IAM Identity Center","Successor to AWS Single Sign-On. Can use its own directory, Active Directory or an external identity provider."],
["Sign-in for customers of your web or mobile app","Amazon Cognito","Sign-up and sign-in, including Google, Facebook, Apple and SAML sign-in."],
["Managed Microsoft Active Directory","AWS Directory Service","AWS Managed Microsoft AD, or AD Connector to use an existing on-premises directory."],
["Maximum permissions for accounts in an organization","Service control policy (SCP)"],
["Set up a governed multi-account environment","AWS Control Tower"],
["Share resources between accounts","AWS Resource Access Manager","Example: share subnets or a Transit Gateway with other accounts."]]},
{d:2,t:"Root user",k:"list",rows:[
"The root user is the identity created with the account's email address. It has full access that IAM policies cannot limit.",
"Turn on MFA, use a strong unique password, and do not create root access keys.",
"Use root only for tasks that need it: changing the root email, password or account name; closing the account; restoring lost IAM admin permissions; activating IAM access to the Billing console; registering as a seller in the Reserved Instance Marketplace; enabling MFA delete on an S3 bucket.",
"Use IAM Identity Center or IAM roles for daily work.",
"In AWS Organizations, an SCP can limit the root user of a member account, and root access for member accounts can be managed centrally."]},
{d:2,t:"Security group or network ACL",k:"table",
intro:"Use both for defense in depth: the network ACL guards the subnet and the security group guards each instance.",
head:["","Security group","Network ACL"],rows:[
["Level","Instance (network interface)","Subnet"],
["State","Stateful: replies are allowed automatically","Stateless: replies need their own rule"],
["Rules","Allow only","Allow and deny"],
["Rule order","All rules are evaluated together","Numbered, lowest first, first match wins"],
["Default","New group denies all inbound, allows all outbound","Default ACL allows all inbound and outbound"],
["Applies to","Only instances it is attached to","Every instance in the subnet"]]},

{d:3,t:"Global infrastructure",k:"pairs",rows:[
["Geographic area with several isolated zones","Region","Regions are isolated from each other. Data stays in a Region unless you move it."],
["One or more discrete data centers with redundant power and networking","Availability Zone","Zones in a Region are physically separate and linked by low-latency networking. Most Regions have three or more."],
["Caches content close to users","Edge location","There are many more edge locations than Regions. Used by CloudFront, Route 53, Global Accelerator and Shield."],
["AWS compute in a large city, closer to users than the Region","Local Zone","Single-digit millisecond latency for media, gaming and similar workloads."],
["AWS compute inside 5G carrier networks","Wavelength Zone","Ultra-low latency for mobile devices."],
["AWS racks in your own data center","AWS Outposts"],
["Protects against a data center failure","Multi-AZ"],
["Protects against a geographic disaster, or meets data residency needs","Multi-Region"],
["How to choose a Region","Compliance, latency, available services, price","Compliance comes first. Not every service is in every Region, and prices differ by Region."],
["Services that are global, not Regional","IAM, Route 53, CloudFront, AWS Organizations"]]},
{d:3,t:"Ways to access and deploy",k:"pairs",rows:[
["Web interface","AWS Management Console","Good for learning and one-time tasks. There is also a mobile app."],
["Commands and scripts in a shell","AWS CLI","Uses the same APIs as the console."],
["Calls from application code","AWS SDK","Available for Python (Boto3), Java, JavaScript, .NET, Go and more."],
["Browser shell with the AWS CLI already set up","AWS CloudShell","Free, and opens from the console."],
["Templates, infrastructure as code","AWS CloudFormation","JSON or YAML templates create stacks. Free; you pay for the resources it creates."],
["Infrastructure as code in a programming language","AWS Cloud Development Kit (AWS CDK)","Produces CloudFormation templates."],
["Upload code and AWS runs the web app","AWS Elastic Beanstalk","Handles capacity, load balancing, scaling and health. You can still reach the instances."],
["Catalog of company-approved products","AWS Service Catalog"],
["Shell access without SSH ports","Systems Manager Session Manager","Access is controlled with IAM and logged."]]},
{d:3,t:"Compute and containers",k:"pairs",rows:[
["Virtual servers with full control","Amazon EC2","You choose the machine image (AMI), instance type, storage and network. Linux and Windows are usually billed per second."],
["Run code on events, up to 15 minutes","AWS Lambda","Pay per request and run time. Scales automatically. No servers to manage."],
["Serverless containers","AWS Fargate","Works with ECS and EKS. Pay for the vCPU and memory a task uses."],
["AWS-native container orchestration","Amazon ECS","Runs containers on EC2 instances you manage or on Fargate."],
["Managed Kubernetes","Amazon EKS","Choose it when the team already uses Kubernetes."],
["Container image registry","Amazon ECR"],
["Simple server at a fixed monthly price","Amazon Lightsail","Bundles a server, SSD storage, data transfer and DNS."],
["Large batch computing jobs","AWS Batch","Schedules and runs jobs on EC2 or Fargate. Pay only for the resources used."],
["AWS hardware in your own building","AWS Outposts"],
["Adds and removes instances","EC2 Auto Scaling","Set minimum, desired and maximum capacity. Scales on CloudWatch metrics or a schedule."],
["Spreads traffic across targets","Elastic Load Balancing","Health checks send traffic only to healthy targets, across Availability Zones."],
["Template used to launch instances","Amazon Machine Image (AMI)","Contains the operating system and software. Can be copied to other Regions."]]},
{d:3,t:"Load balancer types",k:"table",head:["Type","Layer","Use it for"],rows:[
["Application Load Balancer","7 (HTTP, HTTPS)","Web apps, routing by URL path or host name, microservices and containers"],
["Network Load Balancer","4 (TCP, UDP, TLS)","Extreme performance, very low latency, static IP addresses"],
["Gateway Load Balancer","3 (IP packets)","Third-party virtual appliances, such as firewalls"],
["Classic Load Balancer","4 and 7","Previous generation. Not for new work"]]},
{d:3,t:"EC2 instance families",k:"pairs",rows:[
["Balanced, web servers, small databases","General purpose","T and M families. Burstable T instances suit low load with occasional spikes."],
["High CPU, batch, encoding, gaming servers","Compute optimized","C family. Also scientific modeling and high-performance web servers."],
["Large datasets in RAM","Memory optimized","R and X families. In-memory databases and real-time big data."],
["Heavy reads and writes to local disk","Storage optimized","I and D families. High IOPS, data warehousing, distributed file systems."],
["GPU work, machine learning, graphics","Accelerated computing","P and G families with GPUs, or AWS Inferentia and Trainium chips."]]},
{d:3,t:"Storage types",k:"pairs",
tip:"Block = EBS or instance store. File = EFS or FSx. Object = S3.",rows:[
["Object storage","Amazon S3","Virtually unlimited. Objects up to 5 TB each, stored in buckets and reached over HTTPS."],
["Persistent block volume for EC2","Amazon EBS","Lives in one Availability Zone. Back it up with snapshots, which are incremental and stored in S3."],
["Temporary block storage on the host, lost when the instance stops","Instance store","Very fast. Use only for caches, buffers and scratch data."],
["Shared file system for Linux","Amazon EFS","Grows and shrinks automatically. Many instances across Availability Zones can use it at once."],
["Windows file server, Lustre, NetApp ONTAP, OpenZFS","Amazon FSx","Lustre suits high-performance computing."],
["On-premises apps using cloud storage with a local cache","AWS Storage Gateway","Types: S3 File Gateway, FSx File Gateway, Volume Gateway, and Tape Gateway to replace physical tape."],
["Central backups across services","AWS Backup","Policy-based backup plans for EBS, RDS, DynamoDB, EFS and more."],
["Fast recovery of servers into AWS","AWS Elastic Disaster Recovery","Continuous replication, then recovery in minutes."]]},
{d:3,t:"Amazon S3 storage classes",k:"table",
intro:"All classes are designed for 11 nines of durability. Most store data across at least three Availability Zones. The IA and Glacier classes charge a fee to retrieve data.",
head:["Class","Use it when","Retrieval","Minimum days"],rows:[
["Standard","Data is used often","Milliseconds","None"],
["Intelligent-Tiering","Access is unknown or changes","Milliseconds (optional archive tiers are slower)","None"],
["Express One Zone","Most performance-critical apps, one zone","Single-digit milliseconds","None"],
["Standard-IA","Used rarely, needed fast","Milliseconds","30"],
["One Zone-IA","Used rarely and can be recreated","Milliseconds, one zone only","30"],
["Glacier Instant Retrieval","Archive read about once a quarter","Milliseconds","90"],
["Glacier Flexible Retrieval","Archive read once or twice a year","Minutes to hours","90"],
["Glacier Deep Archive","Lowest cost, long-term retention","Within 12 to 48 hours","180"]]},
{d:3,t:"Amazon S3 features",k:"pairs",
intro:"Bucket names are unique across all of AWS, but each bucket lives in one Region. New objects are encrypted by default.",rows:[
["Keep every version of an object and recover from accidental deletes","S3 Versioning"],
["Move objects to cheaper classes or delete them on a schedule","S3 Lifecycle rules"],
["Copy objects automatically to another bucket or Region","S3 Replication","Cross-Region or Same-Region. Used for compliance, lower latency and disaster recovery."],
["Objects cannot be changed or deleted for a set time (write once, read many)","S3 Object Lock","Meets records-retention rules."],
["Faster long-distance uploads through edge locations","S3 Transfer Acceleration"],
["Serve a simple HTML site straight from a bucket","Static website hosting","Usually paired with CloudFront for HTTPS and caching."],
["Stop any bucket from becoming public by mistake","S3 Block Public Access","On by default for new buckets."],
["Control who can access a bucket","Bucket policy","A resource-based policy written in JSON."],
["Upload a large file in parallel parts","Multipart upload"]]},
{d:3,t:"Databases",k:"pairs",
tip:"Relational, SQL and transactions = RDS or Aurora. Key-value at massive scale = DynamoDB. Analytics on huge datasets = Redshift. Repeated reads = ElastiCache.",rows:[
["Managed relational database","Amazon RDS","Engines: MySQL, PostgreSQL, MariaDB, Oracle, SQL Server, Db2 and Aurora. AWS handles patching, backups and failover."],
["Standby copy in another zone with automatic failover","RDS Multi-AZ","For availability, not for spreading read traffic."],
["Extra copies that handle read traffic","Read replicas","For performance. Can be in other Regions."],
["MySQL and PostgreSQL compatible, built by AWS","Amazon Aurora","Six copies of data across three Availability Zones. Aurora Serverless scales capacity automatically."],
["NoSQL key-value, milliseconds, serverless","Amazon DynamoDB","Global tables replicate across Regions. DAX adds a microsecond cache."],
["In-memory cache","Amazon ElastiCache","Valkey, Redis OSS or Memcached. Cuts latency and database load."],
["Durable in-memory database","Amazon MemoryDB","Valkey and Redis OSS compatible. Used as a primary database, not just a cache."],
["Graph, relationships","Amazon Neptune","Social networks, recommendations, fraud detection."],
["MongoDB compatible","Amazon DocumentDB"],
["Apache Cassandra compatible","Amazon Keyspaces"],
["Time series data, such as sensor readings","Amazon Timestream"],
["Data warehouse","Amazon Redshift","Analytics (OLAP) on very large structured data. RDS is for transactions (OLTP)."],
["Full control of the database and its OS","Database on Amazon EC2","You patch, back up and scale it yourself. Pick it only when a managed service cannot meet a need."]]},
{d:3,t:"Networking",k:"pairs",rows:[
["Your isolated private network","Amazon VPC","Regional. You choose an IP range and divide it into subnets, each in one Availability Zone."],
["Subnet with a route to an internet gateway","Public subnet","Load balancers and NAT gateways usually sit here."],
["Subnet with no route from the internet","Private subnet","Databases and application servers usually sit here."],
["Rules that decide where network traffic goes","Route table"],
["Lets a public subnet reach the internet","Internet gateway","Managed and highly available. One per VPC."],
["Outbound internet only, for private subnets","NAT gateway","Placed in a public subnet and managed by AWS."],
["Private path from a VPC to S3 or DynamoDB","Gateway VPC endpoint","No internet or NAT needed, and no extra charge."],
["DNS and domain registration","Amazon Route 53","Routing policies: simple, weighted, latency, failover, geolocation, geoproximity, multivalue answer, IP-based."],
["Content delivery network, caching","Amazon CloudFront","Caches at edge locations. Works with S3, EC2 and load balancers, and with WAF and Shield."],
["Faster network path over the AWS network, static IPs, no caching","AWS Global Accelerator","Good for non-HTTP traffic such as games, and fast failover between Regions."],
["Dedicated private line","AWS Direct Connect","Consistent performance and lower data transfer cost. Takes weeks to set up. Add a VPN on top for encryption."],
["Encrypted tunnel for an office, over the internet","AWS Site-to-Site VPN","Quick to set up. Uses a virtual private gateway or Transit Gateway on the AWS side."],
["Encrypted tunnel for individual users","AWS Client VPN"],
["Hub for many VPCs","AWS Transit Gateway","Hub and spoke. Also connects on-premises networks."],
["Connects two VPCs","VPC peering","Not transitive: A to B and B to C does not connect A to C."],
["Private access to a service without the internet","AWS PrivateLink","Powers interface VPC endpoints."],
["Create and manage APIs","Amazon API Gateway","REST, HTTP and WebSocket APIs, often in front of Lambda."],

/* ---------- router ---------- */
const V={overview:Overview,notes:Notes,practice:Practice,exam:Exam};
const fromHash=()=>{const k=location.hash.slice(1);return V[k]?k:"overview"};
let cur=fromHash();const view=()=>cur;
function go(k){cur=k;try{location.hash=k}catch(e){}render();window.scrollTo(0,0)}
function render(keep){const k=view(),f=document.activeElement;
  const fi=keep&&f&&app.contains(f)&&f.matches(":focus-visible")?[...app.querySelectorAll("button,select")].indexOf(f):-1;
  app.replaceChildren(V[k]());
  if(fi>=0){const el=app.querySelectorAll("button,select")[fi];if(el&&!el.disabled)el.focus()}
  document.querySelectorAll("nav a").forEach(a=>a.getAttribute("href")==="#"+k?a.setAttribute("aria-current","page"):a.removeAttribute("aria-current"))}
addEventListener("hashchange",()=>{const k=fromHash();if(k!==cur){cur=k;render();window.scrollTo(0,0)}});
document.querySelector("nav").addEventListener("click",e=>{const a=e.target.closest("a");if(a&&!e.ctrlKey&&!e.metaKey&&!e.shiftKey){e.preventDefault();go(a.getAttribute("href").slice(1))}});
setInterval(()=>{if(!S.exam)return;const ms=S.exam.end-Date.now();if(ms<=0){finishX();if(view()!=="exam")go("exam");return}
  const t=document.getElementById("timer");if(t){t.textContent=fmt(ms);t.classList.toggle("low",ms<6e5)}},500);
addEventListener("keydown",ev=>{if(ev.ctrlKey||ev.metaKey||ev.altKey||/INPUT|SELECT|TEXTAREA/.test(ev.target.tagName))return;
  const k=view(),i=LET.indexOf(ev.key.toUpperCase());
  if(k==="practice"&&P.list&&P.list.length&&!P.end){const q=P.list[P.i];
    if(ev.key.length===1&&i>=0&&i<P.order.length&&!P.reveal){P.picks=toggle(q,P.picks,P.order[i]);render()}
    else if(ev.key==="Enter"&&!/BUTTON|A/.test(ev.target.tagName)){P.reveal?nextP():checkP()}}
  else if(k==="exam"&&S.exam&&!X.result){const e=S.exam,it=e.items[e.i];
    if(ev.key.length===1&&i>=0&&i<it.order.length){it.picks=toggle(BY[it.id],it.picks,it.order[i]);save();render()}
    else if(ev.key==="ArrowRight")moveX(e.i+1);else if(ev.key==="ArrowLeft")moveX(e.i-1)}});
render();
(function(){const btn=document.getElementById("themeBtn"),root=document.documentElement,mq=matchMedia("(prefers-color-scheme: dark)");
  const isDark=()=>root.dataset.theme?root.dataset.theme==="dark":mq.matches;
  const sync=()=>btn.setAttribute("aria-label",isDark()?"Switch to light mode":"Switch to dark mode");
  btn.addEventListener("click",()=>{const t=isDark()?"light":"dark";root.dataset.theme=t;try{localStorage.setItem("clf-theme",t)}catch(e){}sync()});
  mq.addEventListener("change",sync);sync()})();
